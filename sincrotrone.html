  if(Math.hypot(l.x-l.ax,l.y-l.ay)>l.h*.7){c.strokeStyle=l.col;c.fillStyle=l.col;c.globalAlpha=l.al*.7;c.lineWidth=1.2;c.beginPath();const ex=l.sd?(l.ax<l.x?l.x-l.w/2:l.x+l.w/2):clamp(l.ax,l.x-l.w/2+10,l.x+l.w/2-10),ey=l.sd?l.y:l.y+(l.ay>l.y?l.h/2:-l.h/2),len=Math.hypot(l.ax-ex,l.ay-ey);c.moveTo(ex,ey);c.lineTo(l.ax,l.ay);c.stroke();
   /* the leader ends with a dot (bands and rows) or with an arrowhead (side labels, when there is room for one) */
   if(l.bd||l.free){c.globalAlpha=l.al*.9;c.beginPath();c.arc(l.ax,l.ay,2.4,0,7);c.fill();}
   else if(len>18){const an=Math.atan2(l.ay-ey,l.ax-ex);c.beginPath();c.moveTo(l.ax,l.ay);c.lineTo(l.ax-8*Math.cos(an-.45),l.ay-8*Math.sin(an-.45));c.lineTo(l.ax-8*Math.cos(an+.45),l.ay-8*Math.sin(an+.45));c.closePath();c.fill();}c.globalAlpha=l.al;}
  c.fillStyle=LIGHT?'rgba(251,250,246,.92)':'rgba(16,18,20,.82)';rr(c,l.x-l.w/2,l.y-l.h/2,l.w,l.h,l.h/2);c.fill();c.strokeStyle=l.col;c.globalAlpha=l.al*.75;c.lineWidth=1;c.stroke();c.globalAlpha=l.al;
  txt(c,l.t,l.x,l.y,LIGHT&&!l.big?'#23231d':l.col,l.fs,'center',1);c.restore();}
 LQ=[];}
/* ================================================================== main loop ================================================================== */
let lastT=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-lastT)/1000);lastT=now;clock+=dt;UT.value=clock;c=fit(cv);W=cv.W;H=cv.H;c.clearRect(0,0,W,H);
 if(!V.ok){c.fillStyle=C.bg;c.fillRect(0,0,W,H);txt(c,L('Questa simulazione richiede WebGL.','This simulation needs WebGL.'),W/2,H/2,C.tx,14,'center');return;}
 const dpr=Math.min(window.devicePixelRatio||1,MOB?1.75:2);if(gl.width!==Math.round(W*dpr)||gl.height!==Math.round(H*dpr)){R3.setPixelRatio(dpr);R3.setSize(W,H,false);if(composer){composer.setPixelRatio(dpr);composer.setSize(W,H);}cam.aspect=W/H;cam.updateProjectionMatrix();}
 for(const t of trails)if(t.mat&&t.mat.resolution)t.mat.resolution.set(W,H);
 const s=SL[CUR],st=ST;T+=dt;
 /* the camera: smooth flights between the slides, then a slow drift */
 if(V.goal){const g=V.goal;g.k+=dt/g.dur;const k=Math.min(1,g.k),u=ease(k);V.tgt.lerpVectors(g.f.t,g.to.t,u);V.dist=g.f.d+(g.to.d-g.f.d)*u+g.hop*Math.sin(Math.PI*u);V.az=g.f.a+wrapA(g.to.a-g.f.a)*u;V.el=g.f.e+(g.to.e-g.f.e)*u+(g.hop?.12*Math.sin(Math.PI*u):0);if(g.k>=1){V.goal=null;V.arrived=clock;}}
 const da=V.arrived>=0?clamp((clock-V.arrived)/3,0,1):0,az=V.az+da*.08*Math.sin((clock-V.arrived)*.16),el=V.el+da*.025*Math.sin((clock-V.arrived)*.11);
 CAMK=Math.max(1,1.25/(W/H))*(W<600&&(s.labs||[]).length?1.12:1);const ce=Math.cos(el),D=V.dist*CAMK;cam.position.set(V.tgt.x+Math.sin(az)*ce*D,V.tgt.y+Math.sin(el)*D,V.tgt.z+Math.cos(az)*ce*D);cam.lookAt(V.tgt);
 /* the machine runs its cycle all the time; some slides restart it from the phase they talk about */
 inSt(st,()=>{st.update(dt);st.vis(dt);if(s.every&&T>=NEXT){NEXT+=s.every;s.run(st);}});
 stepSparks(dt);
 if(composer&&bloom&&bloom.enabled)composer.render();else R3.render(scene,cam);
 /* labels emerge once the camera has arrived */

 SIDE=!!s.side;flushLabels();
 for(const p of pops){p.a+=dt;const q=toScr(...p.p);if(!q[2]||!s.pop)continue;c.save();c.globalAlpha=Math.max(0,1-p.a/1.4)*la;if(!LIGHT){c.shadowColor='rgba(0,0,0,.8)';c.shadowBlur=5;}txt(c,p.t,q[0],q[1]-10-p.a*34,p.col,W<600?13:16,'center',1);c.restore();}pops=pops.filter(p=>p.a<1.4);
 let hb=0;if(s.ov&&la>0){c.save();c.globalAlpha=la;hb=st.overlay()||0;c.restore();}
 st.hud(hb);}
applyLang();
