 {k:'S',c:[57,0,12,205,0,.45],labs:[],dyn:true,ov:true,

   'Each ion hits the plate at a distance 2r from the slit and leaves a mark. Natural neon leaves three lines: ²⁰Ne (90%), ²²Ne (9%) and the very rare ²¹Ne (0.3%), almost invisible. Counting the ions at each distance gives the mass spectrum (the graph): this is how it was discovered that elements have isotopes.'],

 /* ---------- 3. the cyclotron ---------- */
 {k:'C',c:[40,-20,120,1300,-.55,.36],labs:[0,7,6,9],P:{spd:4,expC:false,bfld:false,grf:false},

   'The magnet weighs more than 200 tonnes; its upper half is lifted so we can look inside. The particles turn between the poles, in a vacuum chamber 1.6 m wide, gain energy at every turn and finally leave towards the target along the beam line.']},

 {k:'C',c:[0,0,0,360,-.2,.78],labs:[1,3],P:{spd:1.6,expC:true,bfld:false},

   'Two hollow copper electrodes shaped like a D. Inside a dee the electric field is zero: the proton, which started from the source at the centre, follows half a circle without gaining energy. Then it crosses the gap, gets a push and enters the other dee on a slightly larger circle. Turn after turn the path becomes a spiral.'],

   'There is an alternating voltage between the dees: the dees change colour (red positive, blue negative) when the polarity reverses. The reversal happens every half turn, so the proton always finds the electric field on its side and at each crossing gains an energy qV (the green numbers). The time of half a turn never changes: this is why the rhythm stays the same.'],

const CHN={M:['Le bobine','The coils'],S:['Lo spettrometro di massa','The mass spectrometer'],C:['Il ciclotrone','The cyclotron']};
/* ================================================================== camera ================================================================== */
const ease=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2,wrapA=a=>Math.atan2(Math.sin(a),Math.cos(a));
function camOf(s){const st=s.k?ST[s.k]:null,c=typeof s.c==='function'?s.c(st):s.c;if(!st)return c;const g=st.g.position;return[c[0]+g.x,c[1]+g.y,c[2]+g.z,c[3],c[4],c[5]];}
function shadowOf(s){if(!s.k)return[0,0,2100];const d=STN[s.k];return[d.x,d.z,d.sh];}
function camTo(cw,dur,hop,sh){V.goal={f:{t:V.tgt.clone(),d:V.dist,a:V.az,e:V.el},to:{t:new THREE.Vector3(cw[0],cw[1],cw[2]),d:cw[3],a:cw[4],e:cw[5]},k:0,dur,hop:hop||0,sh,swapped:false};V.arrived=-1;}
function camSnap(cw){V.tgt.set(cw[0],cw[1],cw[2]);V.dist=cw[3];V.az=cw[4];V.el=cw[5];V.goal=null;V.arrived=clock;const k_=SL[CUR].k;showSt(k_?[k_]:null);}
/* ================================================================== slide changes and the card ================================================================== */
let CUR=0,T=0,NEXT=0;
function enterSlide(s){const st=s.k?ST[s.k]:null;Object.assign(P,s.P||{});T=0;NEXT=s.every||0;
 if(st)inSt(st,()=>{if(s.enter)s.enter(st);if(s.run)s.run(st);if(s.k==='C'&&!cicLive(st))st.inject();});}
/* on phones, stations out of the shot are not drawn while the camera stands still */
function showSt(keys){for(const k in ST)ST[k].g.visible=!MOB||keys===null||keys.includes(k);}
function go(i,instant){const n=SL.length;i=(i%n+n)%n;const prev=SL[CUR],s=SL[i];CUR=i;enterSlide(s);showSt(s.k&&prev.k?[s.k,prev.k]:null);
 const cw=camOf(s),sh=shadowOf(s);
 if(instant||!V.ok){camSnap(cw);shadowAt(...sh);}
 else{const far=prev.k!==s.k,dd=V.tgt.distanceTo(new THREE.Vector3(cw[0],cw[1],cw[2]));camTo(cw,far?3.4:2.2,far?Math.min(1400,dd*.45):0,sh);}
 card(!instant);$('#tap').style.opacity=i===0?1:0;}
let cardT=0;
function cardFill(){const s=SL[CUR];$('#ct').textContent=s.k?L(...CHN[s.k]):L('Introduzione','Introduction');$('#tt').textContent=L(...s.t);$('#tb').textContent=L(...s.b);
 $('#fx').textContent=(s.f||'').replace('due volte a giro',L('due volte a giro','twice per turn'));
 $$('#chap button').forEach(b=>b.classList.toggle('on',b.dataset.c===s.k));
 const same=SL.map((x,j)=>[x,j]).filter(a=>a[0].k===s.k);$('#dots').innerHTML=s.k?same.map(a=>'<i class="'+(a[1]===CUR?'on':'')+'"></i>').join(''):'';
 $('#cnt').textContent=(CUR+1)+' / '+SL.length;$('#next').textContent=CUR===SL.length-1?L('↺ Ricomincia','↺ Start again'):L('Avanti ▶','Next ▶');$('#cb').scrollTop=0;}
function card(anim){clearTimeout(cardT);if(!anim){cardFill();$('#cb').classList.remove('out');return;}$('#cb').classList.add('out');cardT=setTimeout(()=>{cardFill();$('#cb').classList.remove('out');},380);}
$('#next').onclick=()=>go(CUR+1);$('#prev').onclick=()=>go(CUR-1);
$('#stage').addEventListener('click',()=>go(CUR+1));
$$('#chap button').forEach(b=>b.onclick=()=>go(SL.findIndex(s=>s.k===b.dataset.c)));
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(CUR+1);}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(CUR-1);}});
function onLang(){if(ST.M)ST.M.shown='';cardFill();}
function onTheme(){if(!V.ok)return;buildAll();enterSlide(SL[CUR]);const g=V.goal;if(g){camSnap([g.to.t.x,g.to.t.y,g.to.t.z,g.to.d,g.to.a,g.to.e]);}shadowAt(...shadowOf(SL[CUR]));}
/* ================================================================== labels drawn over the 3D view ================================================================== */
const pv=new THREE.Vector3();const toScr=(x,y,z)=>{pv.set(x,y,z).project(cam);return[(pv.x+1)/2*W,(1-pv.y)/2*H,pv.z<1];};
function label(p,t,col,big,al){const q=toScr(...p);if(!q[2]||q[0]<-80||q[0]>W+80||q[1]<0||q[1]>H||al<=.01)return;c.save();c.globalAlpha=al;const fs=big?20:(W<620?11:12.5);c.font='600 '+fs+'px '+FONT;const w=c.measureText(t).width+(big?20:16),hh=big?30:fs+11;
 c.fillStyle=LIGHT?'rgba(251,250,246,.88)':'rgba(16,18,20,.74)';rr(c,q[0]-w/2,q[1]-hh/2,w,hh,hh/2);c.fill();c.strokeStyle=col;c.globalAlpha=al*.75;c.lineWidth=1;c.stroke();c.globalAlpha=al;txt(c,t,q[0],q[1],LIGHT&&!big?'#23231d':col,fs,'center',1);c.restore();}
const W3=(st,p)=>{const g=st.g.position;return[p[0]+g.x,p[1]+g.y,p[2]+g.z];};
const INTRO=[['M',[0,110,0],['1 · Bobine','1 · Coils'],'#f0a35e'],['S',[30,60,0],['2 · Spettrometro di massa','2 · Mass spectrometer'],'#8fd6c4'],['C',[0,260,0],['3 · Ciclotrone','3 · Cyclotron'],'#e9cf78']];
/* ================================================================== main loop ================================================================== */
let lastT=performance.now(),fcount=0;
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-lastT)/1000);lastT=now;clock+=dt;UT.value=clock;c=fit(cv);W=cv.W;H=cv.H;c.clearRect(0,0,W,H);
 if(!V.ok){c.fillStyle=C.bg;c.fillRect(0,0,W,H);txt(c,L('Questa simulazione richiede WebGL.','This simulation needs WebGL.'),W/2,H/2,C.tx,14,'center');return;}
 const dpr=Math.min(window.devicePixelRatio||1,MOB?1.5:2);if(gl.width!==Math.round(W*dpr)||gl.height!==Math.round(H*dpr)){R3.setPixelRatio(dpr);R3.setSize(W,H,false);if(composer){composer.setPixelRatio(dpr);composer.setSize(W,H);}cam.aspect=W/H;cam.updateProjectionMatrix();}
 for(const t of trails)if(t.mat&&t.mat.resolution)t.mat.resolution.set(W,H);
 /* only the station being visited runs its experiment; each slide repeats its own launch every few seconds */
 const s=SL[CUR],st=s.k?ST[s.k]:null;T+=dt;
 if(st)inSt(st,()=>{st.update(dt);st.vis(dt);
  if(s.every&&T>=NEXT){NEXT+=s.every;s.run(st);}
  if(s.k==='C'){if(cicLive(st))st.idle=0;else if((st.idle=(st.idle||0)+dt)>1.6){st.idle=0;st.inject();}}
  if(s.k==='S'&&st.hits.length>2600)st.clear();});
 stepSparks(dt);if(++fcount%2===0)for(const t of trails)if(t.pts)tSync(t);
 /* the camera: smooth flights between the slides (rising over the room between stations), then a slow drift */
 if(V.goal){const g=V.goal;g.k+=dt/g.dur;const k=Math.min(1,g.k),u=ease(k);V.tgt.lerpVectors(g.f.t,g.to.t,u);V.dist=g.f.d+(g.to.d-g.f.d)*u+g.hop*Math.sin(Math.PI*u);V.az=g.f.a+wrapA(g.to.a-g.f.a)*u;V.el=g.f.e+(g.to.e-g.f.e)*u+(g.hop?.25*Math.sin(Math.PI*u):0);
  if(!g.swapped&&u>=.5){g.swapped=true;shadowAt(...g.sh);}if(g.k>=1){V.goal=null;V.arrived=clock;const k_=SL[CUR].k;showSt(k_?[k_]:null);}}
 const da=V.arrived>=0?clamp((clock-V.arrived)/3,0,1):0,az=V.az+da*.07*Math.sin((clock-V.arrived)*.16),el=V.el+da*.025*Math.sin((clock-V.arrived)*.11);
 const ce=Math.cos(el),D=V.dist*Math.max(1,1.25/(W/H));cam.position.set(V.tgt.x+Math.sin(az)*ce*D,V.tgt.y+Math.sin(el)*D,V.tgt.z+Math.cos(az)*ce*D);cam.lookAt(V.tgt);
 if(composer&&bloom&&bloom.enabled)composer.render();else R3.render(scene,cam);
 /* labels emerge once the camera has arrived */
 const la=V.arrived>=0?clamp((clock-V.arrived-.2)/.8,0,1):0;
 if(!s.k){for(const l of INTRO)label(W3(ST[l[0]],l[1]),L(...l[2]),l[3],true,la);}
 else{for(const i of s.labs||[]){const l=st.labs[i];if(!l)continue;const p=l[3]==='mag'&&st.topG?[0,st.topG.position.y+150,-60]:l[0];label(W3(st,p),L(...l[1]),l[2],false,la);}
  if(s.dyn&&st.dyn){const dy=typeof st.dyn==='function'?st.dyn():st.dyn;for(const l of dy)label(W3(st,l[0]),l[1][0],l[2],l[1][0].length<=2,la*(l[3]==null?1:l[3]));}}
 for(const p of pops){p.a+=dt;const q=toScr(...p.p);if(!q[2]||!s.dyn)continue;c.save();c.globalAlpha=Math.max(0,1-p.a/1.3)*la;if(!LIGHT){c.shadowColor='rgba(0,0,0,.8)';c.shadowBlur=5;}txt(c,p.t,q[0]+46,q[1]-14-p.a*30,p.col,13,'left',1);c.restore();}pops=pops.filter(p=>p.a<1.3);
 if(s.ov&&st&&st.overlay&&la>0){c.save();c.globalAlpha=la;st.overlay();c.restore();}}
applyLang();
if(V.ok){buildAll();}
go(0,true);requestAnimationFrame(frame);
</script>
